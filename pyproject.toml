[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskvm"
version = "0.1.0-w1"
description = "TaskVM — compile live state of multiple existing apps into an editable, executable, verifiable task interface. W1 kill-test."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "openai>=1.40",
    "requests>=2.31",
    "pillow>=10.0",
    # playwright is installed separately (see README) because it needs `playwright install`
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["taskvm*"]
