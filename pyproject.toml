[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskvm"
version = "0.2.0"
description = "TaskVM — compile live state of multiple existing apps into an editable, executable, verifiable task interface."
requires-python = ">=3.10"
# Standard env: taskvm conda env (Python 3.10). Set TASKVM_PYTHON to point to it.
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",      # E17-B: HumanWebSocketDriver (L4 real-human path)
    "simple-websocket>=1.0",    # WS transport backend for flask-socketio (no C extension needed)
    "openai>=1.40",
    "requests>=2.31",
    "pillow>=10.0",
    "aiohttp>=3.9",             # MobileGym bridge async HTTP
    "jsonschema>=4.20",         # A2UI v0.9 schema validation (a2ui_schema_manager)
    "a2ui-agent-sdk>=0.4.0",    # GenUI production layer: official catalog/validator (taskvm/genui)
    # playwright is installed separately (see README) because it needs `playwright install`
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["taskvm*", "taskvm_bench*"]

[tool.setuptools.package-data]
taskvm = ["genui/prompts/*.md"]
